<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>映屿 CineIsle Server</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:linear-gradient(135deg,#f6f2e9,#eef3ff);color:#26314d;padding:32px;line-height:1.8}
    .card{max-width:760px;margin:auto;background:rgba(255,255,255,.86);border-radius:28px;padding:30px;box-shadow:0 20px 70px rgba(54,67,113,.16);border:1px solid rgba(255,255,255,.8)}
    code{background:#eef1fb;border-radius:10px;padding:3px 8px} .muted{color:#72809d}
  </style>
</head>
<body>
  <div class="card">
    <h1>映屿 CineIsle Server</h1>
    <p>后端正在运行。App 里填写这个服务地址，即可创建或加入观影房间。</p>
    <p class="muted">CineIsle 不提供影视资源，也不会上传本地视频文件；它只同步房间状态、播放进度、聊天、弹幕、笔记和观影卡片。</p>
    <p>健康检查：<code>/api/health</code></p>
    <p>MCP 接口：<code>/mcp</code></p>
  </div>
</body>
</html>
